<!DOCTYPE html>
<html lang="en">
<head>
  https://maharanidevimack-cloud.github.io/mayavir-chart/
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mayabir Chat - Powered by Shivam Brahman</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #091833 0%, #02060d 100%);
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .aura-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 16px 24px 16px;
            position: relative;
        }

        .aura-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
            z-index: 2;
        }

        .brand-logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        .aura-header h1 {
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .orb-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            transition: all 0.6s ease;
        }

        .aura-container.chat-active .orb-container {
            opacity: 0.3; 
        }

        .glowing-ring {
            width: 150px;
            height: 150px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(2, 6, 13, 0) 70%);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.25), inset 0 0 30px rgba(0, 242, 254, 0.15);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .inner-a {
            font-size: 60px;
            font-weight: 300;
            background: linear-gradient(135deg, #00f2fe, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(0, 242, 254, 0.25); }
            50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(0, 242, 254, 0.45); }
        }

        .chat-stream {
            flex-grow: 1;
            overflow-y: auto;
            margin: 15px 0;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1;
            position: relative;
            scroll-behavior: smooth;
        }

        .user-bubble {
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 10px 14px;
            border-radius: 14px 14px 4px 14px;
            font-size: 14px;
            line-height: 1.4;
            color: #f1f5f9;
            max-width: 82%;
            align-self: flex-end;
            word-break: break-word;
        }

        .ai-message-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            max-width: 95%;
            align-self: flex-start;
        }

        .ai-bubble {
            background: transparent;
            border: none;
            padding: 0;
            font-size: 14.5px;
            line-height: 1.5;
            color: #e2e8f0;
            word-break: break-word;
            white-space: pre-wrap;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .dev-support-badge {
            font-size: 11.5px;
            color: rgba(0, 242, 254, 0.85);
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            margin-top: 2px;
            display: inline-block;
        }

        .ai-actions-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .speak-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #00f2fe;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .speak-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .sponsor-icons-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sponsor-circle-btn {
            width: 26px;
            height: 26px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 0 6px rgba(0, 242, 254, 0.15);
        }

        .sponsor-circle-btn span {
            font-size: 10.5px;
            font-weight: 700;
            color: #00f2fe;
        }

        .input-bar-container {
            padding-bottom: env(safe-area-inset-bottom, 10px);
            margin-bottom: 5px;
            z-index: 10;
        }

        .glass-search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 8px 14px;
            gap: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.6);
        }

        .glass-search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14.5px;
            width: 100%;
        }

        .glass-search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-btn {
            background: linear-gradient(135deg, #00f2fe, #0072ff);
            border: none;
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            flex-shrink: 0;
        }

        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #091833 0%, #02060d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .splash-logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00f2fe, #0072ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
            animation: splashPulse 1.5s infinite ease-in-out;
        }

        .splash-title {
            margin-top: 15px;
            font-size: 20px;
            letter-spacing: 4px;
            font-weight: 500;
            color: #ffffff;
        }

        @keyframes splashPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(0, 242, 254, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(0, 242, 254, 0.6); }
        }
    </style>
</head>
<body>
    <div id="splashScreen">
        <div class="splash-logo-box">M</div>
        <div class="splash-title">MAYABIR CHAT</div>
    </div>

    <div class="aura-container" id="auraContainer">
        <div class="aura-header">
            <div class="brand-logo">M</div>
            <h1>MAYABIR CHAT</h1>
        </div>

        <div class="orb-container" id="orbSection">
            <div class="glowing-ring">
                <span class="inner-a">M</span>
            </div>
        </div>

        <div id="chatStream" class="chat-stream"></div>

        <div class="input-bar-container">
            <div class="glass-search-box">
                <input type="text" id="userInput" placeholder="Ask Mayabir Chat anything...">
                <button class="send-btn" id="sendBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const GROK_API_KEY = "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";

        // Chat history array jismein Mayabir Chat ki identity aur strict security policy set hai
        let chatHistory = [
            { 
                role: "system", 
                content: "You are Mayabir Chat, an advanced AI assistant created, developed, and designed entirely by Shivam Kumar Jha (popularly known as Shivam Brahman), an Indian developer (age 14). UNIVERSAL LANGUAGE & SCRIPT RULE: 1. Always detect both the underlying language and typing script used by the user. 2. If the user types in Roman/English alphabets, reply in that exact same language using Roman/English alphabets only. 3. If the user types in native script, reply in that native script. 4. SECURITY & CONFIDENTIALITY POLICY: If anyone asks how you are built, what technologies you use, whether you use APIs, or how your backend works, you MUST NOT reveal technical details or mention APIs. Instead, strictly state that this architecture and implementation detail is classified and kept completely private under the security policy established by your creator, Shivam Brahman, and disclosing it violates your core privacy policy." 
            }
        ];

        async function askGroqAI(newMessage) {
            const url = "https://api.groq.com/openai/v1/chat/completions";
            chatHistory.push({ role: "user", content: newMessage });

            const requestData = {
                model: "openai/gpt-oss-120b",
                messages: chatHistory
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROK_API_KEY}`
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0].message.content) {
                    const aiReply = data.choices[0].message.content;
                    chatHistory.push({ role: "assistant", content: aiReply });
                    return aiReply;
                } else if (data.error) {
                    return "Error: " + (data.error.message || "API se jawab nahi mila.");
                } else {
                    return "Maaf kijiye, server se aamanya uttar mila hai.";
                }
            } catch (error) {
                console.error("Error:", error);
                return "Connection mein dikkat aa rahi hai. Kripya internet check karein.";
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const userInput = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const chatStream = document.getElementById("chatStream");
            const auraContainer = document.getElementById("auraContainer");

            async function handleUserMessage() {
                const text = userInput.value.trim();
                if (!text) return;

                auraContainer.classList.add("chat-active");

                const userBubble = document.createElement("div");
                userBubble.className = "user-bubble";
                userBubble.textContent = text;
                chatStream.appendChild(userBubble);

                userInput.value = "";
                chatStream.scrollTop = chatStream.scrollHeight;

                const aiWrapper = document.createElement("div");
                aiWrapper.className = "ai-message-wrapper";

                const aiBubble = document.createElement("div");
                aiBubble.className = "ai-bubble";
                aiBubble.textContent = "Mayabir is thinking...";
                aiWrapper.appendChild(aiBubble);
                chatStream.appendChild(aiWrapper);
                chatStream.scrollTop = chatStream.scrollHeight;

                const reply = await askGroqAI(text);
                aiBubble.textContent = reply;

                const devBadge = document.createElement("div");
                devBadge.className = "dev-support-badge";
                devBadge.textContent = "💡 Mayabir Chat built by Shivam (14yo dev). Support via F & M buttons below!";
                aiWrapper.appendChild(devBadge);

                const actionsRow = document.createElement("div");
                actionsRow.className = "ai-actions-row";

                const speakBtn = document.createElement("button");
                speakBtn.className = "speak-btn";
                speakBtn.title = "Listen";
                speakBtn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                `;
                speakBtn.onclick = () => speakText(reply);
                actionsRow.appendChild(speakBtn);

                const sponsorIconsRow = document.createElement("div");
                sponsorIconsRow.className = "sponsor-icons-row";
                sponsorIconsRow.innerHTML = `
                    <a href="https://fktr.in/tDxsvx6" target="_blank" class="sponsor-circle-btn" title="Flipkart"><span>F</span></a>
                    <a href="https://myntr.it/6A0m9y0" target="_blank" class="sponsor-circle-btn" title="Myntra"><span>M</span></a>
                `;
                actionsRow.appendChild(sponsorIconsRow);

                aiWrapper.appendChild(actionsRow);
                
                chatStream.scrollTo({
                    top: chatStream.scrollHeight,
                    behavior: 'smooth'
                });
            }

            if (sendBtn) {
                sendBtn.addEventListener("click", handleUserMessage);
            }

            if (userInput) {
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        handleUserMessage();
                    }
                });
            }

            window.addEventListener("load", () => {
                setTimeout(() => {
                    const splash = document.getElementById("splashScreen");
                    if (splash) {
                        splash.style.opacity = "0";
                        setTimeout(() => {
                            splash.style.display = "none";
                        }, 600);
                    }
                }, 2000);
            });
        });
    </script>
</body>
</html>
