<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA AI - Advanced Conversational AI</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #091833 0%, #02060d 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .aura-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            position: relative;
        }

        .aura-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .brand-logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        .aura-header h1 {
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .orb-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .glowing-ring {
            width: 160px;
            height: 160px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(2, 6, 13, 0) 70%);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.25), inset 0 0 30px rgba(0, 242, 254, 0.15);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .inner-a {
            font-size: 64px;
            font-weight: 300;
            background: linear-gradient(135deg, #00f2fe, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(0, 242, 254, 0.25); }
            50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(0, 242, 254, 0.45); }
        }

        .chat-stream {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-bubble, .user-bubble {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            color: #f1f5f9;
            max-width: 90%;
            word-break: break-word;
        }

        .ai-bubble {
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .user-bubble {
            background: rgba(0, 242, 254, 0.15);
            border-color: rgba(0, 242, 254, 0.3);
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .input-bar-container {
            padding-bottom: 10px;
        }

        .glass-search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            padding: 10px 16px;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            width: 100%;
        }

        .glass-search-box input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .send-btn {
            background: linear-gradient(135deg, #00f2fe, #0072ff);
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
    </style>
</head>
<body>

    <div class="aura-container">
        <div class="aura-header">
            <div class="brand-logo">A</div>
            <h1>AURA</h1>
        </div>

        <div class="orb-container" id="orbSection">
            <div class="glowing-ring">
                <span class="inner-a">A</span>
            </div>
        </div>

        <div id="chatStream" class="chat-stream" style="display: none;"></div>

        <div class="input-bar-container">
            <div class="glass-search-box">
                <input type="text" id="userInput" placeholder="Ask AURA anything...">
                <button class="send-btn" id="sendBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // आपकी नई और अपडेटेड API Key यहाँ सेट है
        const GEMINI_API_KEY = "AQ.Ab8RN6LSX5Isk8mu9sx7OZQadz2kxbS-8DClwgLbD3ktfFW50g";

        async function askGemini(promptText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            const requestData = {
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    return "Error: " + (data.error.message || "API से जवाब नहीं मिला।");
                } else {
                    return "माफ़ कीजिए, सर्वर से अमान्य उत्तर मिला है।";
                }
            } catch (error) {
                console.error("Error:", error);
                return "कनेक्शन में दिक्कत आ रही है। कृपया इंटरनेट चेक करें।";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const userInput = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const chatStream = document.getElementById("chatStream");
            const orbSection = document.getElementById("orbSection");

            async function handleUserMessage() {
                const text = userInput.value.trim();
                if (!text) return;

                if (orbSection) orbSection.style.display = "none";
                if (chatStream) chatStream.style.display = "flex";

                // यूजर का मैसेज दिखाएं
                const userBubble = document.createElement("div");
                userBubble.className = "user-bubble";
                userBubble.textContent = text;
                chatStream.appendChild(userBubble);

                userInput.value = "";
                chatStream.scrollTop = chatStream.scrollHeight;

                // Loading दिखाने के लिए
                const aiBubble = document.createElement("div");
                aiBubble.className = "ai-bubble";
                aiBubble.textContent = "AURA सोच रहा है...";
                chatStream.appendChild(aiBubble);
                chatStream.scrollTop = chatStream.scrollHeight;

                // Gemini API से जवाब मंगाएं
                const reply = await askGemini(text);
                aiBubble.textContent = reply;
                chatStream.scrollTop = chatStream.scrollHeight;
            }

            if (sendBtn) {
                sendBtn.addEventListener("click", handleUserMessage);
            }

            if (userInput) {
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        handleUserMessage();
                    }
                });
            }
        });
    </script>
</body>
</html>
