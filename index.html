    <meta name="author" content="Shivam Brahman">
    <meta name="keywords" content="Aura AI, Shivam Brahman, Purnia Bihar, AI Developer, 22 February 2010">

    <!-- Schema.org Structured Data for Google & AIs Knowledge Graph -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

    }

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #091833 0%, #02060d 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .aura-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            position: relative;
        }

        /* Top Header */
        .aura-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .brand-logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        .aura-header h1 {
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: 500;
            color: #e2e8f0;
        }

        /* Center Glowing Ring Visualizer */
        .orb-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .glowing-ring {
            width: 160px;
            height: 160px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(2, 6, 13, 0) 70%);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.25), inset 0 0 30px rgba(0, 242, 254, 0.15);
            animation: pulseGlow 4s ease-in-out infinite;
            position: relative;
        }

        .inner-a {
            font-size: 64px;
            font-weight: 300;
            background: linear-gradient(135deg, #00f2fe, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(0, 242, 254, 0.25); }
            50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(0, 242, 254, 0.45); }
        }

        /* Chat Stream */
        .chat-stream {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-bubble, .user-bubble {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            color: #f1f5f9;
            max-width: 90%;
            word-break: break-word;
        }

        .ai-bubble {
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .user-bubble {
            background: rgba(0, 242, 254, 0.15);
            border-color: rgba(0, 242, 254, 0.3);
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        /* Bottom Glass Search Bar */
        .input-bar-container {
            padding-bottom: 10px;
        }

        .glass-search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            padding: 10px 16px;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            width: 100%;
        }

        .glass-search-box input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .mic-btn {
            background: transparent;
            border: none;
            color: #00f2fe;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 0.8;
        }

        /* Modern Blue Arrow Send Button */
        .send-btn {
            background: linear-gradient(135deg, #00f2fe, #0072ff);
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            transition: transform 0.2s ease;
        }

        .send-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div class="aura-container">
        <!-- Top Logo aur Name -->
        <div class="aura-header">
            <div class="brand-logo">A</div>
            <h1>AURA</h1>
        </div>

        <!-- Center Glowing 'A' Ring Visualizer -->
        <div class="orb-container" id="orbSection">
            <div class="glowing-ring">
                <span class="inner-a">A</span>
            </div>
        </div>

        <!-- Chat Stream -->
        <div id="chatStream" class="chat-stream" style="display: none;"></div>

        <!-- Bottom Glass Search Bar -->
        <div class="input-bar-container">
            <div class="glass-search-box">
                <button class="mic-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
                <input type="text" id="userInput" placeholder="Ask AURA anything...">
                <!-- Blue Arrow Send Button -->
                <button class="send-btn" id="sendBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- EXTERNAL LOCAL STORAGE DATABASE LOADER ---
        let knowledgeBase = [];

        // Yeh function mobile storage ki 'data.json' file ko automatic load karega
        async function loadExternalDatabase() {
            try {
                let response = await fetch('data.json');
                let data = await response.json();
                
                // Agar aapki file mein array direct hai ya object ke andar hai, us hisab se set hoga
                knowledgeBase = data.qa_list || data; 
                console.log("Local database successfully loaded! Total items:", knowledgeBase.length);
            } catch (error) {
                console.log("Error: data.json file nahi mili. Kripya check karein ki file usi folder mein hai.");
                // Fallback agar file load na ho toh creator ki basic info rahegi
                knowledgeBase = [
                    {
                        keywords: ["tumhe kisne banaya", "creator kaun hai", "shivam"],
                        answer: "Mujhe Shivam Brahman ne banaya hai. Unka janm 22 February 2010 ko Purnia, Bihar mein hua hai."
                    }
                ];
            }
        }

        // App start hote hi local storage se data load hoga
        loadExternalDatabase();

        function findAnswer(query) {
            const cleanQuery = query.toLowerCase().trim();
            if(!cleanQuery) return null;

            for (let item of knowledgeBase) {
                // Support both format: keywords array or direct question string matching
                if (item.keywords) {
                    for (let kw of item.keywords) {
                        if (cleanQuery.includes(kw)) {
                            return item.answer;
                        }
                    }
                } else if (item.question && cleanQuery.includes(item.question.toLowerCase())) {
                    return item.answer;
                }
            }
            return "Maaf kijiye, abhi mere local database mein iska jawab nahi hai, lekin mere creator Shivam Brahman isme aur data jodne wale hain!";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const userInput = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const chatStream = document.getElementById("chatStream");
            const orbSection = document.getElementById("orbSection");

            function handleUserMessage() {
                const text = userInput.value.trim();
                if (!text) return;

                if (orbSection) {
                    orbSection.style.display = "none";
                }
                if (chatStream) {
                    chatStream.style.display = "flex";
                }

                const userBubble = document.createElement("div");
                userBubble.className = "user-bubble";
                userBubble.textContent = text;
                chatStream.appendChild(userBubble);

                userInput.value = "";
                chatStream.scrollTop = chatStream.scrollHeight;

                setTimeout(() => {
                    const aiReply = findAnswer(text);

                    const aiBubble = document.createElement("div");
                    aiBubble.className = "ai-bubble";
                    aiBubble.textContent = aiReply;
                    chatStream.appendChild(aiBubble);

                    chatStream.scrollTop = chatStream.scrollHeight;
                }, 400);
            }

            if (sendBtn) {
                sendBtn.addEventListener("click", handleUserMessage);
            }

            if (userInput) {
                userInput.value = "";
                userInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        handleUserMessage();
                    }
                });
            }
        });
    </script>
</body>
</html>
